baseURL: "https://etcasketera.github.io/"
locale: en-us
theme: ["PaperMod"]
title: Etash Chandran

params:
  searchConfig:
    limit: 20
    threshold: 0.4
    keys:
      - title
      - permalink
      - summary
      - content
  mainSections:
    - featured

  homeInfoParams:
    Title: "Welcome"
    Content: "A library of learnings"
  
  socialIcons:
    - name: github
      url: "https://github.com/etcasketera"
    - name: linkedin
      url: "https://linkedin.com/in/etashc"
    - name: email
      url: "mailto:etashchandran@gmail.com"
  
  ShowBreadCrumbs: true
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: false

menu:
  main:
    - indentifier: archives
      name: "Archive"
      url: '/archives/'
      weight: 10
    - indentifier: posts
      name: "Posts"
      url: '/posts/'
      weight: 9
    # - identifier: search
    #   name: "Search"
    #   url: 'search'
    #   weight: 1
    # - name: "Categories"
    #   url: "/categories/"
    #   weight: 30
    # - name: "Tags"
    #   url: "/tags/"
    #   weight: 40
    # - indentifier: researchwiki
    #   name: "Wiki"
    #   url: '/researchwiki'
    #   weight: 11

outputs:
  home:
    - HTML
    - RSS
    - JSON

taxonomies:
  tag: tags
  category: categories
  person: people
  status: status